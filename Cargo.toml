[package]
name = "spacetraders"
version = "0.1.0"
edition = "2021"

[lib]
name = "lib"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5.38", features = ["derive"] }
anyhow = "1"
tokio   = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-rusqlite = "0.6"   # or latest
thiserror = "2.0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
strum          = "0.27.1"
strum_macros   = "0.27.1"
serde = { version = "1.0", features = ["derive"] }
figment = { version = "0.10", features = ["env", "toml", "json"]}
figment_file_env_provider = "0.2.0"
tungstenite = { version = "0.26.2", features = [
    "rustls-tls-webpki-roots"
] }
reqwest = {version = "0.12", features = ["json", "rustls-tls"] }
owo-colors = "4.2.1"
serde_json = "1.0.140"
comfy-table = "7.1.4"
chrono = "0.4.41"
rusqlite = "0.32.0"
rand = "0.9.2"
async-trait = "0.1"
strip-ansi-escapes = "0.2.1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
assert_fs  = "1"
wiremock = "0.6"
serde_json = "1"
mockall = "0.12"
insta      = { version = "1", features = ["redactions"] }
